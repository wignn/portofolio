<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script id="theme-bootstrap">
			(() => {
				let theme = 'dark';
				try {
					if (localStorage.getItem('wign-theme') === 'light') theme = 'light';
				} catch {}
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			})();
		</script>
		<style>
			html {
				background: #151916;
			}
			html[data-theme='light'] {
				background: #efefe7;
			}
		</style>
		<link rel="stylesheet" href="/vendor/lenis-1.3.26.css" />
		<script src="/vendor/lenis-1.3.26.min.js" defer></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			document.body.classList.toggle('light', document.documentElement.dataset.theme === 'light');
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
